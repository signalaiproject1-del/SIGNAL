name: Refresh official sources
on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: signal-source-refresh
  cancel-in-progress: false
jobs:
  refresh:
    if: github.repository == 'signalaiproject1-del/SIGNAL' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pinned PDF parser
        run: python -m pip install -r scripts/requirements.txt
      - name: Test collection and extraction
        run: python -m unittest discover -s tests -p '*_test.py'
      - name: Refresh official sources
        run: python scripts/refresh_sources.py
